name: Release

# Push a version tag (e.g. v0.2.5 or v0.2.5-beta-1) to create a DRAFT release.
# The tag must match package.json's version. Tier 0 must pass before anything is built.
# Review the draft, run the hardware tiers from TESTING.md, then publish it by hand.

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  tier0:
    name: Tier 0 gate
    uses: ./.github/workflows/tests.yml

  build-and-draft:
    name: Build and draft release
    needs: tier0
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Check tag matches package.json version
        run: |
          VERSION=$(node -p "require('./package.json').version")
          if [ "$GITHUB_REF_NAME" != "v$VERSION" ]; then
            echo "::error::Tag $GITHUB_REF_NAME doesn't match package.json version v$VERSION. Bump package.json, then re-tag."
            exit 1
          fi

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Build plugin zip
        run: bash build.sh

      - name: Verify zip contents
        run: |
          unzip -l xgmobile-manager.zip
          missing=0
          for f in plugin.json package.json main.py dist/index.js $(git ls-files bin/ assets/services/); do
            if ! unzip -l xgmobile-manager.zip "$f" >/dev/null 2>&1; then
              echo "::error::$f is missing from xgmobile-manager.zip"
              missing=1
            fi
          done
          exit $missing

      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          # Tags with a suffix (v0.2.5-beta-1) are marked as pre-releases, so the README's
          # quick installer (releases/latest/download/xgmobile-manager.zip) keeps serving stable.
          PRERELEASE=""
          case "$TAG" in *-*) PRERELEASE="--prerelease" ;; esac
          gh release create "$TAG" xgmobile-manager.zip \
            --draft $PRERELEASE \
            --verify-tag \
            --title "xgmobile-manager $TAG" \
            --generate-notes
